<style>body{margin:0;background:#0b1120;color:#94a3b8;font-family:Tahoma,sans-serif;display:grid;place-items:center;min-height:100dvh}#s{text-align:center}.sp{width:40px;height:40px;border:3px solid #334155;border-top-color:#e2b340;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 14px}@keyframes r{to{transform:rotate(360deg)}}</style>

<body>
<div id="s"><div class="sp"></div><div>در حال بارگذاری وکیل شو...</div></div>
<script>
(async function () {
  try {
    const res = await fetch('./lafzdar-v8%20(7).html', { cache: 'no-cache' });
    if (!res.ok) throw new Error('missing app');
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('s').innerHTML =
      '<p>خطا در بارگذاری برنامه</p>' +
      '<p style="font-size:12px;margin-top:18px">abolfazlhasankari · @lafzdar</p>';
  }
})();
