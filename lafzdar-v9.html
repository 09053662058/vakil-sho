<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Lafzdar — interactive legal training / آموزش وکالت">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap">
<title>وکیل شو | آموزش وکالت</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1120;
  --surface: #151d2e;
  --surface-2: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --line: #334155;
  --accent: #e2b340;
  --accent-soft: rgba(226,179,64,.18);
  --good: #4ade80;
  --bad: #f87171;
  --shadow: 0 20px 50px rgba(0,0,0,.4);
  --radius: 16px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --text: #0f172a;
  --muted: #475569;
  --line: #cbd5e1;
  --accent: #b45309;
  --accent-soft: rgba(180,83,9,.12);
  --good: #15803d;
  --bad: #b91c1c;
  --shadow: 0 12px 40px rgba(15,23,42,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100dvh;
  color: var(--text);
  background: var(--bg);
  font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { min-height: 100dvh; display: flex; flex-direction: column; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes load { to { width: 100%; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }

.anim { animation: fadeUp .3s ease-out both; }
.loading-screen {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg); gap: 22px;
}
.loading-logo {
  width: 78px; height: 78px; border-radius: 20px;
  border: 2px solid var(--accent);
  display: grid; place-items: center;
  font-size: 34px; color: var(--accent);
  animation: pulse 1.5s ease-in-out infinite;
  background: linear-gradient(145deg, var(--surface-2), transparent);
}
.loading-bar { width: 170px; height: 3px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.loading-bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; animation: load 1.3s ease-out forwards; }
.loading-text { color: var(--muted); font-size: 13px; }

.shell { width: min(100% - 20px, 980px); margin-inline: auto; }
.topbar {
  min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border-bottom: 1px solid var(--line); padding-block: 8px; position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 40px; height: 40px; display: grid; place-items: center;
  border: 1px solid var(--accent); border-radius: 12px; color: var(--accent); font-size: 20px;
  background: linear-gradient(145deg, var(--surface-2), transparent);
}
.brand-name { font-weight: 800; font-size: 15px; }
.brand-sub { color: var(--muted); font-size: 11px; }
.toolbar { display: flex; align-items: center; gap: 5px; }
.icon-btn {
  min-width: 38px; min-height: 38px; padding: 6px 9px;
  border: 1px solid var(--line); border-radius: 11px; background: var(--surface); transition: .2s;
}
.icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }

.main { flex: 1; padding-block: clamp(14px, 3vh, 28px); }
.screen { animation: fadeUp .28s ease-out; }
h1 { font-size: clamp(20px, 4vw, 28px); line-height: 1.3; margin-bottom: 6px; }
h2 { font-size: clamp(15px, 2.4vw, 19px); margin-bottom: 8px; }
.muted { color: var(--muted); }
.eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; margin-bottom: 4px; }

.primary-btn, .soft-btn {
  min-height: 44px; padding: 9px 16px; font-weight: 700; border-radius: 12px;
  border: 1px solid var(--line); transition: .2s;
}
.primary-btn { background: var(--accent); color: #1a1408; border-color: var(--accent); }
.primary-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
.soft-btn { background: var(--surface); }
.soft-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.wide { width: 100%; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }

.login-wrap { min-height: calc(100dvh - 58px); display: grid; place-items: center; }
.login-card {
  width: min(100%, 400px); padding: 28px;
  border: 1px solid var(--line); border-radius: 20px;
  background: var(--surface); box-shadow: var(--shadow); animation: scaleIn .35s ease;
}
.login-card .brand-mark { margin-bottom: 16px; width: 56px; height: 56px; font-size: 28px; }
.field { display: grid; gap: 6px; margin-block: 12px; }
.field label { font-size: 12px; font-weight: 700; }
input, select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg); color: var(--text);
}
textarea { min-height: 100px; resize: vertical; }

.category-card, .case-card, .menu-item {
  min-height: 110px; padding: 16px; text-align: start; cursor: pointer;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); transition: .2s;
}
.category-card:hover, .case-card:hover, .menu-item:hover {
  border-color: var(--accent); transform: translateY(-2px); background: var(--surface-2);
}
.card-icon { font-size: 22px; display: block; margin-bottom: 8px; color: var(--accent); }
.card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: 12px; }
.pill {
  display: inline-flex; padding: 3px 9px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 11px; color: var(--muted);
}
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; }

.panel {
  padding: clamp(16px, 3vw, 24px); border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
}
.case-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.evidence-item {
  display: flex; gap: 12px; padding: 12px; margin-bottom: 8px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  cursor: pointer; transition: .2s;
}
.evidence-item:hover { border-color: var(--accent); }
.evidence-item.selected { border-color: var(--accent); background: var(--surface-2); box-shadow: inset -3px 0 var(--accent); }
.evidence-item input { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: var(--accent); }
.evidence-item strong { display: block; margin-bottom: 3px; font-size: 13px; }
.evidence-item small { color: var(--muted); font-size: 11px; }

.question-box {
  padding: 14px; margin-bottom: 12px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--bg);
}
.question-box h4 { font-size: 14px; margin-bottom: 10px; }
.option-btn {
  display: block; width: 100%; text-align: start; padding: 11px 13px; margin-bottom: 7px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); transition: .2s; font-size: 13px;
}
.option-btn:hover { border-color: var(--accent); }
.option-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
.option-btn.correct { border-color: var(--good); background: rgba(74,222,128,.12); }
.option-btn.wrong { border-color: var(--bad); background: rgba(248,113,113,.12); }

.section { margin-block: 16px; }
.section-title {
  font-size: 13px; font-weight: 700; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.section-title::before { content: ''; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
.info-box {
  padding: 11px 13px; border-radius: 11px; background: var(--surface-2);
  border-inline-start: 3px solid var(--accent); margin-bottom: 8px; font-size: 13px;
}
.result-mark {
  width: 58px; height: 58px; display: grid; place-items: center;
  border-radius: 16px; background: var(--surface-2); font-size: 28px; margin-bottom: 12px;
}
.result-win { color: var(--good); }
.result-loss { color: var(--bad); }
.notice { min-height: 16px; color: var(--bad); font-size: 12px; margin: 6px 0; }

.profile-hero {
  padding: 20px; border: 1px solid var(--line); border-radius: 18px;
  background: linear-gradient(145deg, var(--surface-2), var(--surface));
  margin-bottom: 16px; display: flex; align-items: center; gap: 16px;
}
.avatar {
  width: 64px; height: 64px; border-radius: 16px; background: var(--bg);
  display: grid; place-items: center; font-size: 28px; font-weight: 800;
  color: var(--accent); border: 2px solid var(--accent); flex-shrink: 0;
}
.profile-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.profile-stat {
  text-align: center; padding: 14px 6px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line);
}
.profile-stat strong { display: block; font-size: 18px; color: var(--accent); }
.profile-stat span { font-size: 10px; color: var(--muted); }

.menu-list { display: grid; gap: 8px; }
.menu-item {
  min-height: auto; padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.menu-item .menu-left { display: flex; align-items: center; gap: 12px; }
.menu-item .menu-icon {
  width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft);
  display: grid; place-items: center; font-size: 17px; color: var(--accent);
}
.menu-item strong { display: block; font-size: 13px; }
.menu-item small { color: var(--muted); font-size: 11px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  font-size: 11px; font-weight: 700;
}
.badge-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.level-bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.level-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  padding: 12px; background: rgba(4,8,16,.82); overflow-y: auto;
}
.modal {
  width: min(100%, 820px); max-height: 92dvh; overflow-y: auto; padding: 18px;
  border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow);
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  position: sticky; top: -18px; background: var(--surface); padding-block: 6px; z-index: 2;
}
.admin-section { padding-block: 12px; border-top: 1px solid var(--line); }
.admin-section summary { cursor: pointer; font-weight: 800; font-size: 13px; }
.small-list { list-style: none; margin: 8px 0; display: grid; gap: 6px; }
.list-row {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px;
  padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
}
.compact { min-height: 32px; padding: 3px 9px; font-size: 11px; }
.empty {
  padding: 14px; border: 1px dashed var(--line); border-radius: 11px;
  color: var(--muted); text-align: center;
}
.announcement {
  padding: 10px 13px; margin-bottom: 12px; border: 1px solid var(--accent);
  border-radius: 12px; background: var(--surface-2); font-size: 12px;
}
.ad-box {
  padding: 11px 13px; margin-bottom: 12px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--surface-2); font-size: 12px;
}
.ad-box strong { color: var(--accent); display: block; margin-bottom: 3px; }
.creator {
  padding: 14px 0 18px; color: var(--muted); font-size: 11px;
  text-align: center; border-top: 1px solid var(--line);
}
.history-item {
  padding: 12px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg); margin-bottom: 7px; font-size: 12px;
}
.glossary-item {
  padding: 12px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg); margin-bottom: 7px;
}
.glossary-item strong { color: var(--accent); display: block; margin-bottom: 3px; }
.search-bar { display: flex; gap: 7px; margin-bottom: 14px; }
.search-bar input { flex: 1; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--good); color: #042; padding: 10px 20px;
  border-radius: 12px; font-weight: 700; font-size: 13px; z-index: 150;
  animation: fadeUp .25s ease;
}
.progress-steps { display: flex; gap: 6px; margin-bottom: 16px; }
.progress-steps span {
  flex: 1; height: 4px; border-radius: 99px; background: var(--surface-2);
}
.progress-steps span.active { background: var(--accent); }
.progress-steps span.done { background: var(--good); }

@media (max-width: 560px) {
  .shell { width: min(100% - 12px, 980px); }
  .brand-sub { display: none; }
  .profile-hero { flex-direction: column; text-align: center; }
  .profile-stats { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

.skip-link{position:absolute;inset-inline-start:8px;top:-60px;background:var(--accent);color:#000;padding:8px 14px;border-radius:10px;z-index:400}
.skip-link:focus{top:8px}
.brand[data-action]{cursor:pointer}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;animation:scaleIn .2s both}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(84vw,320px);background:var(--surface);border-inline-end:1px solid var(--line);z-index:301;padding:max(14px,env(safe-area-inset-top)) 14px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;box-shadow:var(--shadow);animation:fadeUp .25s ease-out both}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.drawer-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;text-align:start;font-size:15px}
.drawer-item:hover,.drawer-item.active{background:var(--accent-soft);color:var(--accent)}
.drawer-sep{height:1px;background:var(--line);margin:8px 0}
.drawer-label{color:var(--muted);font-size:12px;padding-inline:4px}
.lang-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lang-btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.lang-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

:root{--accent2:#38bdf8;--grad:linear-gradient(135deg,#e2b340,#f59e0b);--bgfx:radial-gradient(900px 500px at 85% -10%,rgba(226,179,64,.16),transparent 60%),radial-gradient(700px 480px at -10% 30%,rgba(56,189,248,.10),transparent 60%)}
:root[data-theme=light]{--accent2:#0284c7;--grad:linear-gradient(135deg,#b45309,#ea580c);--bgfx:radial-gradient(900px 500px at 85% -10%,rgba(234,88,12,.10),transparent 60%),radial-gradient(700px 480px at -10% 30%,rgba(2,132,199,.08),transparent 60%)}
:root[data-theme=royal]{color-scheme:dark;--bg:#120b2e;--surface:#1c1342;--surface-2:#2a1d5c;--text:#f5f3ff;--muted:#b4a9e0;--line:#43338a;--accent:#fbbf24;--accent-soft:rgba(251,191,36,.18);--good:#34d399;--bad:#fb7185;--accent2:#a78bfa;--grad:linear-gradient(135deg,#a78bfa,#f472b6);--shadow:0 20px 50px rgba(10,5,40,.55);--bgfx:radial-gradient(900px 520px at 90% -10%,rgba(167,139,250,.28),transparent 60%),radial-gradient(700px 480px at -10% 40%,rgba(244,114,182,.16),transparent 60%)}
body{background:var(--bgfx),var(--bg);background-attachment:fixed}
html.fs1{font-size:112%}html.fs2{font-size:125%}
html.reading .panel p,html.reading .info-box{line-height:2.15}
.topbar{backdrop-filter:blur(14px);position:sticky;top:0;z-index:50}
.brand-mark{background:var(--grad);color:#111;border:none;box-shadow:0 6px 18px var(--accent-soft)}
h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.panel,.section,.menu-item,.stat,.evidence-item,.info-box,.ad-box{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--line);transition:transform .25s,border-color .25s,box-shadow .25s}
.menu-item:hover,.evidence-item:hover,.option-btn:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px var(--accent-soft)}
.menu-item:active,.primary-btn:active,.soft-btn:active,.option-btn:active,.bnav button:active{transform:scale(.96)}
.menu-icon{background:var(--grad);color:#111;border-radius:14px;box-shadow:0 6px 16px var(--accent-soft);animation:float 3.5s ease-in-out infinite}
.primary-btn{background:var(--grad);color:#111;font-weight:800;border:none;box-shadow:0 8px 22px var(--accent-soft);position:relative;overflow:hidden}
.primary-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s infinite}
.option-btn{transition:all .25s}.option-btn.selected,.evidence-item.selected{border-color:var(--accent);background:var(--accent-soft);animation:pop .35s}
.evidence-item.selected{box-shadow:inset 0 0 0 1px var(--accent)}
.progress-steps span{transition:all .4s;height:6px;border-radius:9px}.progress-steps span.done{background:var(--good)}.progress-steps span.active{background:var(--grad);animation:pulse 1.6s infinite}
.screen>*{animation:fadeUp .45s ease-out both}.screen>*:nth-child(2){animation-delay:.07s}.screen>*:nth-child(3){animation-delay:.14s}.screen>*:nth-child(4){animation-delay:.21s}
.menu-list>*{animation:fadeUp .45s ease-out both}.menu-list>*:nth-child(2){animation-delay:.06s}.menu-list>*:nth-child(3){animation-delay:.12s}.menu-list>*:nth-child(4){animation-delay:.18s}.menu-list>*:nth-child(5){animation-delay:.24s}.menu-list>*:nth-child(6){animation-delay:.3s}
.result-mark{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;font-size:44px}
.main{padding-bottom:96px}
.toast{background:var(--grad);color:#111;font-weight:700;border-radius:14px;box-shadow:var(--shadow);animation:slideUp .3s both}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;border-radius:20px;background:linear-gradient(135deg,var(--accent-soft),transparent),var(--surface);border:1px solid var(--line);margin-bottom:14px;box-shadow:var(--shadow)}
.ring{--p:0;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);animation:spin .9s ease-out both}
.ring b{width:60px;height:60px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:18px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mini-stats div{text-align:center;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.mini-stats strong{display:block;font-size:20px;color:var(--accent)}
.continue{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px;margin-bottom:14px;border-radius:16px;background:var(--grad);color:#111;font-weight:700;text-align:start;box-shadow:0 10px 26px var(--accent-soft)}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.crumb{font-size:11px;color:var(--muted);margin-bottom:6px}.crumb button{color:var(--accent2)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}.empty span{font-size:40px;display:block;animation:float 3s infinite}
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:60;display:flex;justify-content:space-around;padding:6px 8px max(8px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);animation:slideUp .5s both}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px;font-size:11px;color:var(--muted);border-radius:12px;transition:all .25s}

    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      email: state.email,
      profile: state.profile,
      theme: state.theme, sound: state.sound, fs: state.fs, reading: state.reading,
      categories: state.categories,
      customCases: state.customCases,
      ads: state.ads,
      history: state.history,
      notes: state.notes,
      ratings: state.ratings,
      settings: state.settings,
      adminAttempts: state.adminAttempts,
      adminLockUntil: state.adminLockUntil,
      dailyDone: state.dailyDone
    }));
  } catch (_) {}
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function getTheme(t) {
  state.theme = t;
  document.documentElement.dataset.theme = t;
  save();
}

function allCases() {
  return BASE_CASES.concat(state.customCases);
}

function playableCases() {
  const cats = new Set(state.categories.map(c => c.id));
  return allCases().filter(c => cats.has(c.category));
}

function getCase(id) {
  return playableCases().find(c => c.id === id) || null;
}

function categoryName(id) {
  return state.categories.find(c => c.id === id)?.title || '—';
}

function levelOf(p) {
  // پیشرفت فقط با برد پر می‌شود، نه با هر بازی
  const g = p?.wins || 0;
  return LEVELS.find(l => g >= l.min && g <= l.max) || LEVELS[0];
}

function nextLevel(p) {
  const l = levelOf(p);
  const i = LEVELS.indexOf(l);
  return LEVELS[i + 1] || null;
}

function progressToNext(p) {
  const n = nextLevel(p);
  if (!n) return 100;
  const cur = levelOf(p);
  const w = p?.wins || 0;
  return Math.min(100, Math.round((w - cur.min) / (n.min - cur.min) * 100));
}

function hasBadge(p, id) {
  return (p.badges || []).includes(id);
}

function grantBadge(p, id) {
  if (!p.badges) p.badges = [];
  if (!p.badges.includes(id)) {
    p.badges.push(id);
    state.toast = 'نشان جدید: ' + (BADGES.find(b => b.id === id)?.title || id);
  }
}

function checkBadges(p, r) {
  if (r.won) {
    grantBadge(p, 'first_win');
    if ((p.streak || 0) >= 3) grantBadge(p, 'streak3');
    if ((p.streak || 0) >= 5) grantBadge(p, 'streak5');
  }
  if ((p.games || 0) >= 10) grantBadge(p, 'cases10');
  if ((p.games || 0) >= 25) grantBadge(p, 'cases25');
  if ((p.games || 0) >= 50) grantBadge(p, 'cases50');
  if (r.score >= 90) grantBadge(p, 'perfect');
  if (state.mode === 'hard' && r.won) grantBadge(p, 'hard');
  const cats = new Set((state.history || []).filter(h => h.email === state.email).map(h => h.category));
  if (cats.size >= state.categories.length) grantBadge(p, 'all_cats');
  const today = new Date().toISOString().slice(0, 10);
  if (state.dailyDone === today) grantBadge(p, 'daily');
}

function solvedIds(before) {
  return new Set((state.history || []).filter(h => h && h.email === state.email && (!before || h.at < before)).map(h => h.caseId));
}
function dailyCase() {
  const all = playableCases();
  const dayStart = Math.floor(Date.now() / 86400000) * 86400000, done = solvedIds(dayStart);
  const fresh = all.filter(c => !done.has(c.id));
  const list = fresh.length ? fresh : all;
  if (!list.length) return null;
  const day = Math.floor(Date.now() / 86400000);
  return list[day % list.length];
}

function activeAds(place) {
  return (state.ads || []).filter(a => a && a.enabled !== false && (!a.placements || !a.placements.length || a.placements.includes('all') || a.placements.includes(place)));
}

function renderAds(place) {
  const list = activeAds(place);
  if (!list.length) return '';
  return list.map(a => {
    const body = `<strong>${esc(a.title || 'آگهی')}</strong><div>${esc(a.text || '')}</div>`;
    if (a.link) {
      return `<a class="ad-box" href="${esc(a.link)}" target="_blank" rel="noopener noreferrer" style="display:block;text-decoration:none;color:inherit">${body}<div style="margin-top:6px;font-size:11px;color:var(--accent)">مشاهده ←</div></a>`;
    }
    return `<div class="ad-box">${body}</div>`;
  }).join('');
}

function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = ''; render(); }, 2200);
}

function sendToTelegram(text) {
  if (!TG_PROXY_URL) return;
  try {
    fetch(TG_PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: String(text).slice(0, 1500) }), keepalive: true }).catch(() => {});
  } catch (_) {}
}

}

function renderCases() {
  let list = playableCases().filter(c => c.category === state.categoryId);
  const q = state.caseSearch.trim().toLowerCase();
  if (q) list = list.filter(c => (c.title + c.brief + c.level).toLowerCase().includes(q));
  if (state.caseFilter === 'easy') list = list.filter(c => c.level === 'آسان');

function scoreCase(c) {
  const selected = state.selectedEvidence.map(i => c.evidence[i]).filter(Boolean);
  let correct = 0;
  const details = [];
  (c.questions || []).forEach((q, qi) => {
    const ans = state.answers[qi];
    const isCorrect = ans === q.correct;
    if (isCorrect) correct++;
    details.push({ q: q.q, correct: isCorrect, explain: q.explain });
  });
  const totalQ = (c.questions || []).length || 1;
  let score = 20;
  score += Math.min(selected.length * 15, 35);
  score += Math.round((correct / totalQ) * 45);
  if (state.mode === 'hard') score = Math.max(0, score - 5);
  score = Math.min(100, Math.round(score));
  const threshold = state.mode === 'hard' ? 55 : 50;
  const won = selected.length >= 1 && correct >= Math.ceil(totalQ * 0.5) && score >= threshold;
  let reason;
  if (won) {
    reason = `وکیل محترم، با استناد به ${selected.length} مدرک و پاسخ درست به ${correct} سوال از ${totalQ}، لایحه شما پذیرفته شد. امتیاز: ${score}.`;
  } else if (selected.length < 1) {
    reason = 'حداقل یک مدرک باید انتخاب شود.';
  } else {
    reason = `ثبت شد اما برای عبور از معیار، نیاز به انتخاب مدارک مرتبط‌تر و پاسخ دقیق‌تر به سوالات است. امتیاز: ${score}.`;
  }
  return { won, score, evidenceCount: selected.length, correctAnswers: correct, totalQuestions: totalQ, reason, details };
}

function doSubmitCase() {
  const c = getCase(state.caseId);
  if (!c) { state.notice = 'پرونده پیدا نشد'; render(); return; }
  if (state.selectedEvidence.length < 1) { state.notice = 'حداقل یک مدرک انتخاب کنید'; state.playStep = 1; render(); return; }
  const unanswered = (c.questions || []).some((_, i) => state.answers[i] === undefined);
  if (unanswered) { state.notice = 'به همه سوالات پاسخ دهید'; render(); return; }

  const r = scoreCase(c);
  state.result = r;
  const p = state.profile;
  p.games = (p.games || 0) + 1;
  if (r.won) {
    p.wins = (p.wins || 0) + 1;
    p.streak = (p.streak || 0) + 1;
    p.highScore = Math.max(p.highScore || 0, r.score);
  } else {
    p.streak = 0;
  }
  checkBadges(p, r);
  state.history.push({
    email: state.email,
    caseId: c.id,
    title: c.title,
    category: c.category,
    categoryName: categoryName(c.category),
    won: r.won,
    score: r.score,
    at: Date.now(),
    mode: state.mode
  });
  if (state.history.length > 300) state.history = state.history.slice(-300);
  const today = new Date().toISOString().slice(0, 10);
  if (dailyCase()?.id === c.id) state.dailyDone = today;
  save();

  const tgText = `⚖ وکیل شو | نتیجه پرونده
👤 ${state.profile.name || 'بدون نام'}
📧 ${state.email}
📁 ${c.title}
🏷 ${categoryName(c.category)}
${r.won ? '✅ برد' : '❌ نیاز به تقویت'}
⭐ امتیاز: ${r.score}
📊 مدارک: ${r.evidenceCount} | درست: ${r.correctAnswers}/${r.totalQuestions}`;
  sendToTelegram(tgText);

  state.screen = 'result';
  state.notice = '';
  render();
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.lang = state.lang;
  document.documentElement.dir = 'rtl';
  if (state.loading) {
    app.innerHTML = renderLoading();
    return;
  }
  let content = '';
  if (state.screen === 'home') content = renderHome();
  else if (state.screen === 'profile') content = renderProfile();
  else if (state.screen === 'history') content = renderHistory();
  else if (state.screen === 'glossary') content = renderGlossary();
  else if (state.screen === 'about') content = renderAbout();
  else if (state.screen === 'categories') content = renderCategories();
  else if (state.screen === 'cases') content = renderCases();
  else if (state.screen === 'play') content = renderPlay();
  else if (state.screen === 'result') content = renderResult();
  else content = renderHome();

  if (['profile', 'history', 'glossary', 'about'].includes(state.screen)) content = renderAds('info') + content;
  const modal = state.showEmailGate ? renderEmailGate()
    : state.admin === 'password' ? renderAdminLogin()
    : state.admin === 'panel' ? renderAdminPanel() : '';
  const toast = state.toast ? `<div class="toast">${esc(state.toast)}</div>` : '';
  app.innerHTML = header() + `<main id="main" class="main shell">${content}</main>${footer()}${renderMenu()}${state.screen === 'play' ? '' : renderBottomNav()}${modal}${toast}`;
  document.documentElement.className = 'fs' + state.fs + (state.reading ? ' reading' : '');
  if (state.screen === 'result' && state.result && state.confettiFor !== state.result) {
    state.confettiFor = state.result; feedback(state.result.won);
    if (state.result.won) { const d = document.createElement('div'); d.className = 'confetti'; d.innerHTML = Array.from({ length: 36 }, () => `<i style="left:${Math.random() * 100}%;background:hsl(${Math.random() * 360},85%,60%);animation-delay:${Math.random() * .6}s"></i>`).join(''); app.appendChild(d); setTimeout(() => d.remove(), 3600); }
  }
  document.body.style.overflow = (state.menu || modal) ? 'hidden' : '';
  if (state.lastScreen !== state.screen) { state.lastScreen = state.screen; window.scrollTo(0, 0); }
}

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;
  if (state.menu && a !== 'menu' && !['fs-up','fs-dn','snd','read'].includes(a) && b.closest('.drawer')) state.menu = false;

  if (a === 'menu') { state.menu = !state.menu; render(); }
  else if (a === 'fs-up') { state.fs = Math.min(2, state.fs + 1); save(); render(); }
  else if (a === 'fs-dn') { state.fs = Math.max(0, state.fs - 1); save(); render(); }
  else if (a === 'snd') { state.sound = !state.sound; save(); render(); }
  else if (a === 'read') { state.reading = !state.reading; save(); render(); }
  else if (a === 'close-menu') { state.menu = false; render(); }
  else if (a === 'theme') { getTheme({ dark: 'light', light: 'royal', royal: 'dark' }[state.theme] || 'dark'); render(); }
  else if (a === 'admin') {
    if (Date.now() < state.adminSessionUntil) {
      state.adminSessionUntil = Date.now() + 30 * 60 * 1000;
      state.admin = 'panel';
    } else {
      state.admin = 'password';
    }
    state.notice = '';
    render();
  }
  else if (a === 'close-admin' || (a === 'backdrop' && e.target === b)) { state.admin = ''; state.editingAd = null; state.notice = ''; render(); }
  else if (a === 'home') { state.screen = 'home'; render(); }
  else if (a === 'cases') { state.screen = backTarget(); render(); }
  else if (a === 'profile') { state.screen = 'profile'; render(); }
  else if (a === 'history') { state.screen = 'history'; render(); }
  else if (a === 'glossary') { state.screen = 'glossary'; render(); }
  else if (a === 'about') { state.screen = 'about'; render(); }
  else if (a === 'categories') { state.screen = 'categories'; render(); }
  else if (a === 'category') { state.categoryId = b.dataset.id; state.caseSearch = ''; state.caseFilter = 'all'; state.screen = 'cases'; render(); }
  else if (a === 'case') {
    const id = b.dataset.id;
    state.fromDaily = false;
    if (!state.email) {
      state.pendingCaseId = id;
      state.showEmailGate = true;
      state.notice = '';
      render();
      return;
    }
    state.caseId = id;
    state.selectedEvidence = [];
    state.answers = {};
    state.result = null;
    state.playStep = 0;
    state.notice = '';
    state.screen = 'play';
    render();
  }
  else if (a === 'daily') {
    if (state.dailyDone === new Date().toISOString().slice(0, 10)) { showToast('پرونده‌ی امروز را حل کردید؛ فردا پرونده‌ی جدید می‌آید'); return; }
    state.fromDaily = true;
    const dc = dailyCase();
    if (!dc) { showToast('پرونده‌ای نیست'); return; }
    if (!state.email) {
      state.pendingCaseId = dc.id;
      state.showEmailGate = true;
      state.notice = '';
      render();
      return;
    }
    state.caseId = dc.id;
    state.categoryId = dc.category;
    state.selectedEvidence = [];
    state.answers = {};
    state.result = null;
    state.playStep = 0;
    state.screen = 'play';
    render();
  }
  else if (a === 'cancel-email') { state.showEmailGate = false; state.pendingCaseId = null; state.notice = ''; render(); }
  else if (a === 'backdrop-email') {
    if (e.target === b) {
      state.showEmailGate = false;
      state.pendingCaseId = null;
      state.notice = '';
      render();
    }
  }
  else if (a === 'submit-email') {
    const inp = document.getElementById('email-input');
    const email = (inp ? inp.value : '').trim().toLowerCase();
    if (!email || !email.includes('@') || email.length < 5) {
      state.notice = 'ایمیل معتبر وارد کنید';
      render();
      return;
    }
    state.email = email;
    state.showEmailGate = false;
    state.notice = '';
    save();
    if (state.pendingCaseId) {
      state.caseId = state.pendingCaseId;
      state.pendingCaseId = null;
      state.selectedEvidence = [];
      state.answers = {};
      state.result = null;
      state.playStep = 0;
      state.screen = 'play';
    }
    render();
  }
  else if (a === 'submit-admin') {
    if (Date.now() < state.adminLockUntil) { render(); return; }
    const inp = document.getElementById('admin-pass-input');
    const pass = inp ? inp.value : '';
    if (await verifyAdmin(pass)) {
      state.adminAttempts = 0;
      state.adminLockUntil = 0;
      state.adminSessionUntil = Date.now() + 30 * 60 * 1000;
      state.admin = 'panel';
      state.notice = '';
      save();
      render();
    } else {
      state.adminAttempts = (state.adminAttempts || 0) + 1;
      if (state.adminAttempts >= 5) {
        state.adminLockUntil = Date.now() + 10 * 60 * 1000;
        state.adminAttempts = 0;
        state.notice = 'قفل ۱۰ دقیقه';
      } else {
        state.notice = `اشتباه (${state.adminAttempts}/5)`;
      }
      save();
      render();
    }
  }
  else if (a === 'next-step') {
    if (state.playStep === 1 && state.selectedEvidence.length < 1) {
      state.notice = 'حداقل یک مدرک انتخاب کنید';
      render();
      return;
    }
    if (state.playStep >= 2) {
      const qi = state.playStep - 2;
      if (state.answers[qi] === undefined) {
        state.notice = 'لطفاً یک گزینه را انتخاب کنید';
        render();
        return;
      }
    }
    state.notice = '';
    state.playStep++;
    render();
  }
  else if (a === 'prev-step') { state.playStep = Math.max(0, state.playStep - 1); state.notice = ''; render(); }
  else if (a === 'answer') {
    const qi = Number(b.dataset.q);
    const oi = Number(b.dataset.o);
    state.answers[qi] = oi;
    state.notice = '';
    render();
  }
  else if (a === 'submit-case') doSubmitCase();
  else if (a === 'mode-normal') { state.mode = 'normal'; render(); }
  else if (a === 'mode-hard') { state.mode = 'hard'; render(); }
  else if (a === 'save-profile') {
    const inp = document.getElementById('profile-name');
    if (inp) {
      state.profile.name = inp.value.trim().slice(0, 40);
      save();
      showToast('نام ذخیره شد');
    }
  }
  else if (a === 'save-settings') {
    const t = document.getElementById('set-title');
    const i = document.getElementById('set-intro');
    const an = document.getElementById('set-announcement');
    state.settings.title = (t?.value || '').trim() || 'وکیل شو';
    state.settings.intro = (i?.value || '').trim();
    state.settings.announcement = (an?.value || '').trim();
    save();
    state.notice = 'تنظیمات ذخیره شد';
    render();
  }
  else if (a === 'save-ad') {
    const idEl = document.getElementById('ad-id');
    const titleEl = document.getElementById('ad-title');
    const textEl = document.getElementById('ad-text');
    const linkEl = document.getElementById('ad-link');
    const enEl = document.getElementById('ad-enabled');
    const places = [...document.querySelectorAll('.ad-place:checked')].map(x => x.value);
    const id = (idEl?.value || '') || ('ad-' + Date.now());
    let link = (linkEl?.value || '').trim();
    if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    const ad = {
      id,
      title: (titleEl?.value || '').trim(),
      text: (textEl?.value || '').trim(),
      link,
      enabled: enEl ? enEl.checked : true,
      placements: places.includes('all') ? ['all'] : (places.length ? places : ['all'])
    };
    if (!ad.title || !ad.text) {
      state.notice = 'عنوان و متن تبلیغ لازم است';
      render();
      return;
    }
    const list = Array.isArray(state.ads) ? [...state.ads] : [];
    const idx = list.findIndex(x => String(x.id) === String(id));
    if (idx >= 0) list[idx] = ad;
    else list.push(ad);
    state.ads = list;
    state.editingAd = null;
    state.notice = 'تبلیغ ذخیره شد';
    save();
    render();
  }
  else if (['save-case', 'del-case', 'save-cat', 'del-cat'].includes(a)) {
    if (Date.now() >= state.adminSessionUntil) { state.notice = 'نشست مدیر تمام شده'; render(); return; }
    const v = id => (document.getElementById(id)?.value || '').trim();
    if (a === 'del-case') { state.customCases = state.customCases.filter(c => c.id !== b.dataset.id); state.notice = 'پرونده حذف شد'; }
    else if (a === 'del-cat') {
      if (playableCases().some(c => c.category === b.dataset.id)) state.notice = 'این حوزه پرونده دارد؛ اول پرونده‌ها را حذف کنید';
      else { state.categories = state.categories.filter(c => c.id !== b.dataset.id); state.notice = 'حوزه حذف شد'; }
    } else if (a === 'save-cat') {
      if (!v('k-title')) state.notice = 'نام حوزه را بنویسید';
      else { state.categories = state.categories.concat([{ id: 'u-' + Date.now().toString(36), title: v('k-title'), icon: v('k-icon') || '⚖', description: v('k-desc') }]); state.notice = 'حوزه افزوده شد'; }
    } else {
      const evidence = [1, 2, 3].filter(i => v('e' + i + '-t') && v('e' + i + '-d')).map(i => ({ title: v('e' + i + '-t'), source: v('e' + i + '-s') || 'پرونده', detail: v('e' + i + '-d'), reliability: 'قابل بررسی' }));
      let err = '';
      const questions = [];
      [1, 2, 3].forEach(i => {
        if (!v('q' + i)) return;
        const options = [0, 1, 2, 3].map(o => v('q' + i + '-o' + o));
        if (options.some(o => !o)) { err = 'هر سوال باید چهار گزینه داشته باشد'; return; }
        questions.push({ q: v('q' + i), options, correct: Number(v('q' + i + '-c')) || 0, explain: v('q' + i + '-x') || 'پاسخ درست مطابق اصول حقوقی است.' });
      });
      if (!err && (!v('c-title') || !v('c-brief') || !v('c-role') || !v('c-issue'))) err = 'عنوان، شرح، نقش و موضوع الزامی است';
      if (!err && !evidence.length) err = 'حداقل یک مدرک (عنوان و توضیح) بنویسید';
      if (!err && !questions.length) err = 'حداقل یک سوال کامل بنویسید';
      if (err) { flashToast(err); return; }
      else {
        state.customCases = state.customCases.concat([{ id: 'u-' + Date.now().toString(36), category: v('c-cat'), title: v('c-title'), level: v('c-level') || 'متوسط', brief: v('c-brief'), clientRole: v('c-role'), allegation: v('c-alle') || '—', issue: v('c-issue'), evidence, questions, explanation: v('c-expl') || 'بررسی دلایل و اصول حقوقی تعیین‌کننده است.' }]);
        state.notice = 'پرونده افزوده شد';
      }
    }
    save(); render(); if (state.notice) flashToast(state.notice);
  }
  else if (a === 'ad-clear') { state.editingAd = null; state.notice = ''; render(); }
  else if (a === 'ad-edit') {
    state.editingAd = (state.ads || []).find(x => String(x.id) === String(b.dataset.id)) || null;
    state.notice = '';
    render();
  }
  else if (a === 'ad-delete') {
    const delId = String(b.dataset.id || '');
    state.ads = (state.ads || []).filter(x => String(x.id) !== delId);
    state.editingAd = null;
    state.notice = 'تبلیغ حذف شد';
    save();
    render();
  }
  else if (a === 'export-data') {
    const data = localStorage.getItem(STORAGE_KEY) || '{}';
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lafzdar-backup.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('خروجی آماده شد');
  }
  else if (a === 'import-data') { document.getElementById('import-file')?.click(); }
  else if (a === 'reset-all') {
    if (confirm('همه داده‌ها پاک شود؟')) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }
});

app.addEventListener('change', e => {
  if (e.target.matches('[data-action="evidence"]')) {
    const i = Number(e.target.dataset.index);
    state.selectedEvidence = e.target.checked
      ? [...new Set([...state.selectedEvidence, i])]
      : state.selectedEvidence.filter(x => x !== i);
    e.target.closest('.evidence-item')?.classList.toggle('selected', e.target.checked);
  }
  if (e.target.matches('[data-action="filter-level"]')) {
    state.caseFilter = e.target.value;
    render();
  }
  if (e.target.id === 'import-file' && e.target.files?.[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        location.reload();
      } catch (_) { showToast('فایل نامعتبر'); }
    };
    reader.readAsText(e.target.files[0]);
  }
});

app.addEventListener('submit', async e => {
  const form = e.target;
  if (!(form instanceof HTMLFormElement)) return;
  e.preventDefault();
  const d = new FormData(form);

  if (form.id === 'email-form') {
    const email = String(d.get('email') || '').trim().toLowerCase();
    if (!email || !email.includes('@')) {
      state.notice = 'ایمیل معتبر وارد کنید';
      render();
      return;
    }
    state.email = email;
    state.showEmailGate = false;
    save();
    if (state.pendingCaseId) {
      state.caseId = state.pendingCaseId;
      state.pendingCaseId = null;
      state.selectedEvidence = [];
      state.answers = {};
      state.result = null;
      state.playStep = 0;
      state.screen = 'play';
    }
    state.notice = '';
    render();
  }
  else if (form.id === 'admin-login-form') {
    if (Date.now() < state.adminLockUntil) { render(); return; }
    if (await verifyAdmin(String(d.get('password') || ''))) {
      state.adminAttempts = 0;
      state.adminLockUntil = 0;
      state.adminSessionUntil = Date.now() + 30 * 60 * 1000;
      state.admin = 'panel';
      state.notice = '';
      save();
      render();
    } else {
      state.adminAttempts = (state.adminAttempts || 0) + 1;
      if (state.adminAttempts >= 5) {
        state.adminLockUntil = Date.now() + 10 * 60 * 1000;
        state.adminAttempts = 0;
        state.notice = 'قفل ۱۰ دقیقه';
      } else {
        state.notice = `اشتباه (${state.adminAttempts}/5)`;
      }
      save();
      render();
    }
  }
  else if (form.id === 'settings-form') {
    state.settings.title = String(d.get('title') || '').trim() || 'وکیل شو';
    state.settings.intro = String(d.get('intro') || '').trim();
    state.settings.announcement = String(d.get('announcement') || '').trim();
    save();
    state.notice = 'ذخیره شد';
    render();
  }
  else if (form.id === 'ad-form') {
    const id = String(d.get('id') || '') || ('ad-' + Date.now());
    const placements = d.getAll('placement').map(String);
    const ad = {
      id,
      title: String(d.get('title') || '').trim(),
      text: String(d.get('text') || '').trim(),
      enabled: d.get('enabled') === 'on',
      placements: placements.length ? placements : ['home']
    };
    if (!ad.title || !ad.text) { state.notice = 'عنوان و متن لازم است'; render(); return; }
    const list = state.ads || [];
    const idx = list.findIndex(x => x.id === id);
    if (idx >= 0) list[idx] = ad;
    else list.push(ad);
    state.ads = list;
    state.editingAd = null;
    state.notice = 'آگهی ذخیره شد';
    save();
    render();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (state.menu || state.admin || state.showEmailGate)) { state.menu = false; state.admin = ''; state.showEmailGate = false; state.editingAd = null; render(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.brand[data-action]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape' && (state.admin || state.showEmailGate)) {
    state.admin = '';
    state.showEmailGate = false;
    state.editingAd = null;
    state.notice = '';
    render();
  }
  if (e.key === 'Enter') {
    if (state.showEmailGate && document.getElementById('email-input')) {
      e.preventDefault();
      const btn = document.querySelector('[data-action="submit-email"]');
      if (btn) btn.click();
    }
    if (state.admin === 'password' && document.getElementById('admin-pass-input')) {
      e.preventDefault();
      const btn = document.querySelector('[data-action="submit-admin"]');
      if (btn) btn.click();
    }
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'home-search') { state.homeSearch = e.target.value; const r = document.getElementById('search-res'); if (r) r.innerHTML = searchHTML(state.homeSearch); }
});
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null || state.screen !== 'play' || state.menu || state.admin) { tx = null; return; }
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) < 80) return;
  const b = document.querySelector(dx < 0 ? '[data-action="next-step"]' : '[data-action="prev-step"]'); if (b) b.click();
}, { passive: true });

document.addEventListener('pointerdown', e => {
  const t = e.target.closest && e.target.closest('.primary-btn,.menu-item,.option-btn,.soft-btn,.continue,.drawer-item');
  if (!t) return;
  const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) / 2, w = document.createElement('span');
  w.className = 'ripple'; w.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  t.appendChild(w); setTimeout(() => w.remove(), 650);
});
// Android: back button + status bar (works only inside the Capacitor app)
const BACK_MAP = { play: 'cases', result: 'cases', cases: 'categories', categories: 'home', profile: 'home', history: 'home', glossary: 'home', about: 'home' };
function backTarget() { return state.fromDaily ? 'home' : (state.categoryId ? 'cases' : 'categories'); }
function goBack() {
  if (state.menu || state.admin || state.showEmailGate) { state.menu = false; state.admin = ''; state.showEmailGate = false; state.editingAd = null; render(); return true; }
  const to = (state.screen === 'play' || state.screen === 'result') ? backTarget() : BACK_MAP[state.screen];
  if (!to) return false;
  state.screen = to; render(); return true;
}
try {
  const Cap = window.Capacitor && window.Capacitor.Plugins;
  if (Cap && Cap.App) Cap.App.addListener('backButton', () => { if (!goBack()) Cap.App.exitApp(); });
  if (Cap && Cap.StatusBar) { Cap.StatusBar.setBackgroundColor({ color: '#0b1220' }); Cap.StatusBar.setStyle({ style: 'DARK' }); }
  if (Cap && Cap.SplashScreen) setTimeout(() => Cap.SplashScreen.hide(), 600);
} catch (_) {}

// Init
getTheme(state.theme);
render();
setTimeout(() => {
  state.loading = false;
  state.screen = 'home';
  render();
}, 1100);
</script>
</body>
</html>
